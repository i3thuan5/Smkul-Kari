[tox]
skipsdist = True

[flake8]
max-line-length = 79
exclude =
    .git
    .tox
    venv
    kithann
    scratchpad

[testenv:yamllint]
deps =
    yamllint
commands =
    yamllint .

[testenv:flake8]
deps =
    flake8
commands =
    flake8 . --show-source --count

[testenv:pymarkdown]
deps =
    pymarkdownlnt
commands =
    pymarkdown \
        --strict-config \
        --disable-rules md013,md029 \
        scan .
    pymarkdown \
        --strict-config \
        --disable-rules MD041 \
        scan -r .github/*

[testenv:shellcheck]
allowlist_externals =
    bash
commands =
    bash shellcheck.sh

[testenv:behave]
deps =
    -rrequirements.txt
    behave
commands =
    python -m behave --no-skipped {posargs}

# unittest 單元測試（tests/，不含 e2e），只需要 numpy + Pillow，CI 可以直接跑。
# e2etest  另外把已知的 SRT 燒進合成影片再抽回來比對（tests/e2e/），
#          需要系統套件：ffmpeg、tesseract-ocr、tesseract-ocr-chi-tra、
#          fonts-noto-cjk（.travis.yml 內以 apt addons 安裝）。
[testenv:unittest]
deps =
    numpy
    Pillow
commands =
    python -m unittest discover -s tests/ocr -t {toxinidir} -v
    python -m unittest discover -s tests/srtlib -t {toxinidir} -v
    python -m unittest discover -s tests/asrmt -t {toxinidir} -v
    python -m unittest discover -s tests/news -t {toxinidir} -v
    python -m unittest discover -s tests/transcode -t {toxinidir} -v
    python -m unittest discover -s tests/mxf2mkv -t {toxinidir} -v

[testenv:e2etest]
deps =
    numpy
    Pillow
commands =
    python -m unittest discover -s tests/e2e -t {toxinidir} -v

# rebuild 驗資料流程（srt-data-store spec）：只用 Kari-SRT submodule
# 的 cues/vision TSV 離線重組全部交付 SRT，逐 byte 比對。
# 這條會抓到「缺件、TSV 毀損、程式改動導致輸出漂移」。
# Kari-SRT 是私有 repo，CI 抓不到 submodule，所以這條【不進 CI】——
# 每次程式修改完，在本機跑：tox -e rebuild
[testenv:rebuild]
deps =
    numpy
    Pillow
commands =
    python -m scripts.news.rebuild --verify
