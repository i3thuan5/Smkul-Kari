[tox]
skipsdist = True

[flake8]
max-line-length = 79
exclude =
    .git
    .tox
    venv
    kithann

[testenv:yamllint]
deps =
    yamllint
commands =
    yamllint .

[testenv:flake8]
deps =
    flake8
commands =
    flake8 . --show-source --count

[testenv:pymarkdown]
deps =
    pymarkdownlnt
commands =
    pymarkdown \
        --strict-config \
        --disable-rules md013,md029 \
        scan .
    pymarkdown \
        --strict-config \
        --disable-rules MD041 \
        scan -r .github/*

[testenv:shellcheck]
allowlist_externals =
    bash
commands =
    bash shellcheck.sh

[testenv:test]
deps =
    -rrequirements.txt
commands =
    python -m unittest {posargs}

[testenv:behave]
deps =
    -rrequirements.txt
    behave
commands =
    python -m behave --no-skipped {posargs}

# subtitle     單元測試（tests/，不含 e2e），只需要 numpy + Pillow，CI 可以直接跑。
# subtitle-e2e 另外把已知的 SRT 燒進合成影片再抽回來比對（tests/e2e/），
#              需要系統套件：ffmpeg、tesseract-ocr、tesseract-ocr-chi-tra、
#              fonts-noto-cjk（.travis.yml 內以 apt addons 安裝）。
[testenv:subtitle]
deps =
    numpy
    Pillow
commands =
    python -m unittest discover -s tests/cuelib -t {toxinidir} -v
    python -m unittest discover -s tests/subs2srt -t {toxinidir} -v
    python -m unittest discover -s tests/align -t {toxinidir} -v
    python -m unittest discover -s tests/rtf -t {toxinidir} -v
    python -m unittest discover -s tests/news -t {toxinidir} -v

[testenv:subtitle-e2e]
deps =
    numpy
    Pillow
commands =
    python -m unittest discover -s tests/e2e -t {toxinidir} -v
